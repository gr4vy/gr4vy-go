name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # “At 08:45 on every day-of-week from Monday through Friday.”
    #
    # Staggered across the six SDK repos (java :30, python :35, php :40,
    # go :45, csharp :50, typescript :55). They all run their live suites
    # against the one shared e2e sandbox, and firing together stampedes the
    # auth path's cold public-key cache -> Envelope /decrypt times out at 3s
    # -> every endpoint 500s (Sentry CORE-API-1N0). Keep these apart.
    - cron: 45 8 * * 1-5

permissions:
  contents: read

jobs:
  # Format + build check for the test suite and tooling. We deliberately do not
  # `go vet ./...` the whole module: the generated SDK trips vet's
  # unreachable-code check, which is upstream's concern, not this PR's.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Use Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l test scripts)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet test suite and tooling
        run: go vet ./test/... ./scripts/...

  # E2E suites, sharded by directory so wall-clock stays low. Each shard runs in
  # its own process and provisions exactly one merchant account, so shards are
  # fully independent. The shard map lives here; `go test` runs just that package.
  # Runs on main only (push, schedule, dispatch). The key lives in the `e2e`
  # Environment, which only main can use, so a branch workflow can't read it.
  e2e:
    name: e2e (${{ matrix.shard }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: flows, path: ./test/flows/ }
          - { shard: processing, path: ./test/processing/ }
          - { shard: backoffice, path: ./test/backoffice/ }

    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Use Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Run ${{ matrix.shard }} suite
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SUITE_PATH: ${{ matrix.path }}
        run: go test -count=1 "$SUITE_PATH"

  # Offline tests (JWT + webhook signing + generated unit tests) across the
  # supported Go versions — fast cross-version sanity that needs no sandbox.
  offline:
    name: offline (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.22"
          - "1.23"
          - "1.24"

    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Use Go ${{ matrix.go }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run offline suite
        run: go test -count=1 . ./optionalnullable/... ./internal/...

  # Single stable required check. Branch rulesets require THIS context (not the
  # per-shard matrix jobs, whose names change when shards are added). On a PR it
  # means lint and the offline suites passed; on main it also means the live
  # suite passed, which is what the publish workflow waits for.
  ci-complete:
    name: ci-complete
    needs: [lint, e2e, offline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          LINT: ${{ needs.lint.result }}
          E2E: ${{ needs.e2e.result }}
          OFFLINE: ${{ needs.offline.result }}
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$LINT" != "success" ] || [ "$OFFLINE" != "success" ]; then
            echo "lint: $LINT, offline: $OFFLINE"
            exit 1
          fi
          if [ "$ON_MAIN" != "true" ] && [ "$E2E" = "skipped" ]; then
            exit 0
          fi
          if [ "$E2E" != "success" ]; then
            echo "e2e: $E2E"
            exit 1
          fi

  # Endpoint reach of the live suite, written to the run summary. Runs after the
  # live suite on main. continue-on-error keeps a failed report from failing the
  # CI run, which is what the publish workflow waits for.
  coverage:
    name: coverage
    needs: e2e
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: e2e
    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Use Go 1.24
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      # continue-on-error so the report still builds; the last step fails the
      # job if this failed, so "Re-run failed jobs" reruns it and replaces the
      # comment instead of leaving a partial reach number standing.
      - name: Run full suite with HTTP tracking
        id: suite
        continue-on-error: true
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GR4VY_TRACK_HTTP: "1"
          # One shared, absolute directory so every shard's recorder writes to
          # the same place (each `go test` package runs in its own CWD).
          GR4VY_COVERAGE_DIR: ${{ github.workspace }}/coverage/http
        run: go test -count=1 ./test/...

      - name: Build endpoint-coverage report
        run: go run ./scripts/endpoint_coverage .

      - name: Write the report to the run summary
        env:
          SUITE: ${{ steps.suite.outcome }}
        run: |
          if [ "$SUITE" != "success" ]; then
            echo "> ⚠️ **The test suite failed in this run, so the reach below is incomplete.**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          cat coverage/endpoint-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the suite failed
        if: steps.suite.outcome != 'success'
        run: exit 1

  notify:
    needs: [lint, e2e, offline]
    runs-on: ubuntu-latest
    if: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]')
        env:
            SLACK_USERNAME: Go SDK
            SLACK_TITLE: Go SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy-code
            SLACK_ICON_EMOJI: ":gr4vy:"
            SLACK_COLOR: "${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
            SLACK_MESSAGE_ON_SUCCESS: "CI passed"
            SLACK_MESSAGE_ON_FAILURE: "CI failed"
            SLACK_FOOTER: ""
